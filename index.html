<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente N.E.O.N | Interface IA</title>
    
    <!-- Link ativado para ler as cores do seu CSS! -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <!-- Cabeçalho do Chat -->
        <div class="chat-header">
            💠 SISTEMA N.E.O.N.
        </div>
        
        <!-- Área onde as mensagens da conversa irão aparecer -->
        <div class="chat-box" id="caixa-chat">
            <div class="mensagem msg-ia">
                Sistemas operacionais iniciados. Saudações, Operador. Como posso ajudar com a sua infraestrutura e código hoje?
            </div>
            <!-- Futuras mensagens entrarão aqui pelo JavaScript -->
        </div>

        <!-- Área de digitação do usuário -->
        <div class="chat-input">
            <input type="text" id="campoTexto" placeholder="Comande o agente...">
            <button id="btnEnviar">Enviar</button>
        </div>
    </div>

    <!-- Quando for criar seu JavaScript separado, você vai chamá-lo aqui -->
    <!-- <script src="script.js"></script> -->

</body>
</html>
