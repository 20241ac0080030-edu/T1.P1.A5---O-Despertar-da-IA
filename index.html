<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Neural Multimodal | Agente N.E.O.N.</title>
    <link rel="stylesheet" href="style.css">
    <link class="neon-icon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💠</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <main class="chat-container">
        <!-- Cabeçalho -->
        <header class="chat-header">
            <div class="brand">
                <span class="neon-icon">👁️</span>
                <h1>N.E.O.N. 3.5 VISION</h1>
            </div>

            <div class="player-identity">
                <label for="nickname">NICK:</label>
                <input type="text" id="nickname" placeholder="Seu apelido..." autocomplete="off">
            </div>

            <div class="engine-selector">
                <label for="seletor-versao">NÚCLEO:</label>
                <select id="seletor-versao">
                    <option value="gemini-2.5-flash" selected>NUC 3.5 (Flash - Rápido)</option>
                    <option value="gemini-2.5-flash-lite">NUC 3.1 (Lite - Econômico)</option>
                    <option value="gemini-2.5-pro">NUC 3.1 (Pro - Complexo)</option>
                </select>
            </div>
        </header>

        <!-- Área de Conversação -->
        <section id="caixa-chat" class="chat-box">
            <div class="mensagem msg-ia">
                Sistemas ópticos e neurais ativados. Saudações, Operador. <br>
                <b>👁️ MODO MULTIMODAL:</b> Agora você pode me enviar imagens e fotos de recibos, produtos ou objetos para análise visual!
            </div>
        </section>

        <!-- Container de Preview da Imagem Selecionada -->
        <div id="containerPreview" class="container-preview" style="display: none;">
            <div class="preview-card">
                <img id="imgPreview" src="" alt="Preview">
                <button id="btnRemoverImagem" title="Remover Imagem">&times;</button>
            </div>
        </div>

        <!-- Painel de Input Eletrostático -->
        <footer class="chat-input" style="gap: 8px;">
            <button id="btnLimpar" title="Destruir Banco de Dados" class="btn-danger">☣️ FORMAT</button>
            
            <!-- Botão e Input de Upload de Imagem -->
            <label for="inputImagem" class="btn-anexo" title="Anexar Imagem para Análise Visual">📷</label>
            <input type="file" id="inputImagem" accept="image/*" style="display: none;">

            <input 
                type="text" 
                id="campoTexto" 
                placeholder="Insira comando ou pergunta sobre a imagem..." 
                autocomplete="off"
            >
            <button id="btnEnviar">ENVIAR</button>
            <button id="btnRanking" title="Ver Ranking Global" class="btn-warning">🏆 RANKING</button>
        </footer>
    </main>

    <!-- Modal do Leaderboard Global -->
    <div id="modalRanking" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" id="fecharRanking">&times;</span>
            <h2>🏆 HALL DA FAMA - N.E.O.N. 3.5</h2>
            <div class="ranking-tabela" id="rankingTabela"></div>
        </div>
    </div>

    <script src="index.js"></script>

</body>
</html>
