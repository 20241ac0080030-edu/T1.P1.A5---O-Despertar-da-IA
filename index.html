<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Neural | Agente N.E.O.N.</title>
    
    <!-- Link para a camada estética que faremos no próximo passo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="chat-container">
        <!-- Cabeçalho de Comando -->
        <header class="chat-header">
            <div class="brand">
                <span class="neon-icon">💠</span>
                <h1>SISTEMA N.E.O.N.</h1>
            </div>

            <!-- Seleção de Núcleo (Versão da IA) -->
            <div class="engine-selector">
                <label for="engine">NÚCLEO:</label>
                <select id="seletor-versao">
                    <option value="gemini-2.0-flash">NUC 2.0 (High Speed)</option>
                    <option value="gemini-1.5-flash">NUC 1.5 (Standard)</option>
                    <option value="gemini-1.5-pro">NUC 1.5 PRO (High Logic)</option>
                </select>
            </div>
        </header>

        <!-- Área de Conversação -->
        <section id="caixa-chat" class="chat-box">
            <div class="mensagem msg-ia">
                Sistemas operacionais ativados. Saudações, Operador. 
                Selecione o núcleo desejado e envie seu comando.
            </div>
        </section>

        <!-- Painel de Input -->
        <footer class="chat-input">
            <input 
                type="text" 
                id="campoTexto" 
                placeholder="Insira comando neural..." 
                autocomplete="off"
            >
            <button id="btnEnviar">ENVIAR</button>
        </footer>
    </main>

    <!-- Link para a lógica de comunicação que faremos no Passo 5 -->
    <script src="index.js"></script>

</body>
</html>
