<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Neural | Agente N.E.O.N.</title>
    <link rel="stylesheet" href="style.css">
    <!-- Favicon Emoji -->
    <link class="neon-icon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💠</text></svg>">
    <!-- Biblioteca de Confete (Desafio Hacker) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <main class="chat-container">
        <!-- Cabeçalho de Comando -->
        <header class="chat-header">
            <div class="brand">
                <span class="neon-icon">💠</span>
                <h1>SISTEMA N.E.O.N. 3.5</h1>
            </div>

            <!-- Identificação do Jogador -->
            <div class="player-identity">
                <label for="nickname">NICK:</label>
                <input type="text" id="nickname" placeholder="Seu apelido..." autocomplete="off">
            </div>

            <!-- Seleção de Núcleo (Versões Ativas do Gemini) -->
            <div class="engine-selector">
                <label for="seletor-versao">NÚCLEO:</label>
                <select id="seletor-versao">
                    <option value="gemini-3.5-flash" selected>NUC 3.5 (Flash - Rápido)</option>
                    <option value="gemini-3.1-flash-lite">NUC 3.1 (Lite - Econômico)</option>
                    <option value="gemini-3.1-pro">NUC 3.1 (Pro - Complexo)</option>
                </select>
            </div>
        </header>

        <!-- Área de Conversação -->
        <section id="caixa-chat" class="chat-box">
            <div class="mensagem msg-ia">
                Sistemas operacionais ativados. Saudações, Operador. <br>
                <b>⚠️ IMPORTANTE:</b> Digite o seu NICK (apelido) no cabeçalho antes de enviar comandos para registrar sua pontuação e participar do Ranking!
            </div>
        </section>

        <!-- Painel de Input Eletrostático -->
        <footer class="chat-input" style="gap: 8px;">
            <button id="btnLimpar" title="Destruir Banco de Dados" style="background: #bf1832; color: white; padding: 0 12px; border: 1px solid #ff4444; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: monospace;">☣️ FORMAT</button>
            
            <input 
                type="text" 
                id="campoTexto" 
                placeholder="Insira comando de rede Neural..." 
                autocomplete="off"
            >
            <button id="btnEnviar">ENVIAR</button>
            <button id="btnRanking" title="Ver Ranking Global" style="background: #e1b12c; color: #000; font-weight: bold; border-radius: 8px; border: 1px solid #fbc531; cursor: pointer; padding: 0 12px;">🏆 RANKING</button>
        </footer>
    </main>

    <!-- Modal do Leaderboard Global -->
    <div id="modalRanking" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" id="fecharRanking">&times;</span>
            <h2>🏆 HALL DA FAMA - N.E.O.N. 3.5</h2>
            <div class="ranking-tabela" id="rankingTabela">
                <!-- Conteúdo do Ranking -->
            </div>
        </div>
    </div>

    <script src="index.js"></script>

</body>
</html>
